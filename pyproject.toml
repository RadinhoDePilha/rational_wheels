[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rational-wheels"
version = "0.1.0"
description = "Total arithmetic for rational numbers, infinity, and nullity based on wheels theory."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Rational Wheels contributors" }
]
keywords = ["rational-numbers", "wheel", "arithmetic", "infinity", "nullity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rational_wheels = ["py.typed"]
